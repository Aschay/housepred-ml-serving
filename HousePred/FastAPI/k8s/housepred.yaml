apiVersion: apps/v1
kind: Deployment
metadata:
  name: housepred
spec:
  replicas: 1
  selector:
    matchLabels:
      app: housepred
  template:
    metadata:
      labels:
        app: housepred
    spec:
      containers:
        - name: housepred
          image: housepred:1.0 
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /ready
              port: 80
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: housepred
spec:
  type: NodePort
  selector:
    app: housepred
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
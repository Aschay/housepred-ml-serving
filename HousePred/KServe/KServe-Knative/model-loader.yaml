apiVersion: v1
kind: Pod
metadata:
  name: model-loader
  namespace: kserve
spec:
  containers:
    - name: loader
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: model-storage
          mountPath: /mnt/models
  volumes:
    - name: model-storage
      persistentVolumeClaim:
        claimName: kserve-model-pvc
apiVersion: v1
kind: Pod
metadata:
  name: model-loader
  namespace: kserve
spec:
  containers:
    - name: loader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: model
          mountPath: /mnt/models
  volumes:
    - name: model
      persistentVolumeClaim:
        claimName: kserve-model-pvc